<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing:border-box; margin:0; }
  html,body { width:1600px; height:1000px; }
  body { font-family:-apple-system,"SF Pro Display","Inter",system-ui,sans-serif; color:#fff; overflow:hidden;
         background: radial-gradient(900px 500px at 50% 0%, ACCENT 0%, transparent 65%), linear-gradient(180deg,#0b0d14,#05060a); }
  h2 { text-align:center; font-size:58px; letter-spacing:-0.03em; font-weight:800; margin-top:70px; }
  p { text-align:center; font-size:25px; color:rgba(255,255,255,.72); margin-top:14px; letter-spacing:-0.01em; }
  .row { display:flex; justify-content:center; gap:56px; margin-top:56px; }
  .phone { width:300px; height:650px; border-radius:52px; padding:12px; background:#111; position:relative;
           box-shadow:0 0 0 2px #2a2a2e, 0 40px 100px rgba(0,0,0,.55), inset 0 0 0 2px #3a3a40; }
  .phone img { width:100%; height:100%; object-fit:cover; object-position:top; border-radius:41px; display:block; }
  .phone::after { content:""; position:absolute; top:24px; left:50%; width:22px; height:22px; margin-left:-11px; border-radius:50%; background:#000; }
  .phone.mid { transform: translateY(-24px); }
  .wide { width:700px; height:340px; border-radius:44px; }
  .wide img { border-radius:34px; }
  .wide::after { top:50%; left:22px; margin:-11px 0 0 0; }
  .cap { text-align:center; font-size:19px; color:rgba(255,255,255,.62); margin-top:18px; }
</style></head>
<body>
  <h2>TITLE</h2>
  <p>SUBTITLE</p>
  <div class="row">
    <div><div class="phone">PH1</div><div class="cap">CAP1</div></div>
    <div><div class="phone mid">PH2</div><div class="cap">CAP2</div></div>
    <div><div class="phone">PH3</div><div class="cap">CAP3</div></div>
  </div>
</body></html>
